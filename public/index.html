<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Torre de Controle — Cobli × GR Parcerias</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#07074E;--indigo-700:#04043A;--indigo-50:#ECEDFA;--royal:#001BB8;--cgreen:#0FFDC9;--green:#18B26B;--green-50:#E6F7EF;--red:#D64045;--red-50:#FDECEC;--amber:#E0A21B;--amber-50:#FFF4DB;
--bg:#F5F6FA;--card:#fff;--ink:#16162B;--muted:#6B6F85;--line:#E3E5EE;--radius:12px;--font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--indigo);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:68px;margin:-14px -6px -14px -10px}
header h1{font-size:18px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.75}
.spacer{flex:1}
#saveState{font-size:12px;opacity:.9;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
#saveState.err{background:var(--red)}
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--indigo);border-color:var(--indigo)}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.btn{background:var(--royal);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:#00138A}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--indigo-50)}
header .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.btn.green{background:var(--cgreen);color:var(--indigo);font-weight:600}.btn.green:hover{background:#0BD9AC}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{background:var(--red)}
.ptop{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ptop label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ptop select{min-width:260px}.ptop .grow{flex:1}
.in{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;box-sizing:border-box;font:inherit}
.in:disabled{background:#F3F4F8;color:#9CA0B5}.in.bad{border-color:var(--red);background:var(--red-50)}
.tw .ptab{min-width:0}.ptab td{vertical-align:middle;padding:7px 10px}.ptab th{padding:8px 10px}
.vr{text-align:right;white-space:nowrap}
.mut{font-size:11px;color:var(--muted)}
.dsc-in{display:flex;gap:4px}.dsc-in select.in{width:64px;flex:none}.dsc-in input.in{flex:none;width:76px}
.dsc{color:#A32227;font-size:11px}
.eqs{display:flex;gap:6px}.eqs label{display:block;width:88px}.eqs .mut{white-space:nowrap}.eqs .in{width:100%}
.fres{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--indigo-50);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px}
.fres .tot{margin-left:auto;font-size:14px}
.ptot{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.ptot .kpi{flex:1;min-width:210px;padding:8px 14px}
.ptot .kpi .v{font-size:20px}
.ptot .kpi.main{background:var(--indigo);color:#fff}.ptot .kpi.main .l,.ptot .kpi.main .n{color:#C9CBF0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:26px;font-weight:600;margin-top:2px}.kpi .n{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#FAFAFD;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--indigo-50)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.tw table{min-width:900px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-Ativo,.b-Assinada,.b-ok{background:var(--green-50);color:#0B7A47}
.b-Onboarding,.b-Enviada,.b-warn,.b-Prorrogado{background:var(--amber-50);color:#8A5E00}
.b-Piloto,.b-info{background:var(--indigo-50);color:var(--indigo)}
.b-Pendente,.b-Pausado,.b-Não{background:#ECEDF3;color:#4A4E66}
.b-Encerrado,.b-bad{background:var(--red-50);color:#A32227}
.bar{height:6px;background:#E9EAF2;border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;background:#D9DBE7;display:block}
.dot.ok{background:var(--green)}.dot.andamento{background:var(--amber)}.dot.late{background:var(--red)}
.alert{display:flex;gap:8px;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}
.alert.red{background:var(--red-50);color:#7E1A1E}.alert.amber{background:var(--amber-50);color:#6B4800}.alert.info{background:var(--indigo-50);color:var(--indigo)}
.alert b{cursor:pointer;text-decoration:underline}
.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,td input,td select,.inp{box-sizing:border-box;min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px;width:100%}
label.f textarea,textarea.inp{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo-50);border-color:var(--indigo)}
.overlay{position:fixed;inset:0;background:rgba(22,22,43,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.overlay.on{display:flex}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:1040px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;gap:12px;align-items:center;padding:16px 20px;background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh h2{margin:0;font-size:18px}
.mtabs{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.mtabs button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.mtabs button.on{color:var(--indigo);border-color:var(--indigo)}
.mb{padding:20px}
.etapa{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.etapa.ok{border-color:#BFE8D3}.etapa.late{border-color:#F2B8BA}
.eh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.num{width:28px;height:28px;border-radius:50%;background:#D9DBE7;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.etapa.ok .num{background:var(--green);color:#fff}.etapa.andamento .num{background:var(--amber);color:#fff}.etapa.late .num{background:var(--red);color:#fff}
.eh .t{font-weight:600}.eh .d{font-size:12px;color:var(--muted)}
.ebody{padding:4px 16px 16px;border-top:1px solid var(--line);display:none}
.etapa.open .ebody{display:block}
.efoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.hist{border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.hist div{margin-bottom:10px;font-size:13px}.hist small{display:block;color:var(--muted)}
.row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.fun{display:grid;grid-template-columns:230px 1fr 60px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:#E9EAF2}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--c)}
.falta{background:var(--amber-50);border:1px solid #F1D79A;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.falta ul{margin:6px 0 0;padding-left:18px}
.falta a{color:var(--indigo);cursor:pointer;text-decoration:underline}
.gh{display:grid;grid-template-columns:190px 1fr;gap:10px}
.gmonths{position:relative;height:18px;font-size:11px;color:var(--muted);margin-bottom:4px}
.gmonths span{position:absolute;border-left:1px solid var(--line);padding-left:4px;height:18px}
.grow{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.grow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gtrack{position:relative;height:26px;background:#F0F1F7;border-radius:6px}
.gbar{position:absolute;top:3px;height:20px;border-radius:5px;color:#fff;font-size:11px;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;display:flex;align-items:center;min-width:6px}
.gtoday{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red);z-index:2}
.g-andamento{background:var(--green)}.g-vence{background:var(--amber)}.g-vencido{background:var(--red)}.g-planejado{background:#7A72C9}.g-encerrado{background:#9CA0B5}.g-sem{background:#C9CBD8}
.slack{background:#fff;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;white-space:normal}
code{background:#ECEDF3;padding:1px 6px;border-radius:5px}
.ficha{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.ficha>div{min-width:0}
.radios{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:6px 0}.radios .lbl{font-size:12px;color:var(--muted);font-weight:500;width:100%}
.rd{display:flex;gap:7px;align-items:center;font-size:14px;cursor:pointer}.rd input{width:18px;height:18px;accent-color:var(--royal)}
input.inv{border-color:var(--red)!important;background:var(--red-50)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--indigo);color:#fff;padding:12px 20px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;font-weight:500}
#toast.on{opacity:1}
.savebar{position:sticky;bottom:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 20px rgba(7,7,78,.08)}
.idx{position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.idx a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.idx a:hover{background:var(--indigo-50)}
.idx .st{width:22px;height:22px;border-radius:50%;background:#D9DBE7;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:#4A4E66}
.idx .st.ok{background:var(--green);color:#fff}.idx .st.part{background:var(--amber);color:#fff}
.idx small{margin-left:auto;color:var(--muted);font-size:11px}
.bloco{scroll-margin-top:12px}
.bloco h3{display:flex;align-items:center;gap:10px;font-size:16px}
.bn{width:26px;height:26px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.bloco.ok .bn{background:var(--green)}
.bloco h3 .badge{margin-left:auto}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.eqg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.eq{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.eq.on{border-color:var(--green);background:var(--green-50)}
.eq b{font-size:13px}
.acao{background:var(--indigo-50);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:10px}
.sv0{background:var(--green-50)!important}.sv1{background:var(--amber-50)!important}.sv2{background:var(--red-50)!important}
td input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--green)}
td.c{text-align:center}
tr.off td{opacity:.55}
.grp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.hbar{display:flex;gap:12px;align-items:center;flex:1;min-width:220px}
.hbar .bar{flex:1;height:8px}
td select{min-width:118px}
td.gat select{min-width:118px}
@media(max-width:900px){.ficha{grid-template-columns:1fr}.idx{position:static}}
@media(max-width:700px){main{padding:12px}header{padding:12px}.fun{grid-template-columns:1fr}.grow,.gh{grid-template-columns:110px 1fr}}
/* matriz clientes x blocos */
.mx{width:100%;border-collapse:separate;border-spacing:0 4px}.mx th{font-size:11px;color:var(--muted,#6b6f8d);font-weight:600;text-align:center;padding:2px 4px}.mx th:first-child,.mx td:first-child{text-align:left}
.mx td{padding:3px 4px;text-align:center}.mx td.nm{font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.mx .c{display:inline-flex;width:30px;height:24px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;background:#E9EAF2;color:#8a8da8}
.mx .c.ok{background:var(--green);color:#fff}.mx .c.part{background:#FBE7B5;color:#8a5a00}.mx .c.no{background:#F6D5D6;color:#A32227}
.mx-sum{font-size:13px;margin:0 0 8px}.mx-leg{font-size:11px;margin-top:6px;color:#6b6f8d}
/* calendário */
.cal{position:absolute;z-index:300;background:#fff;border:1px solid #D9DBE7;border-radius:10px;box-shadow:0 10px 28px rgba(7,7,78,.2);padding:10px;width:252px;font-size:13px}
.cal .ch{display:flex;align-items:center;gap:4px;margin-bottom:6px}.cal .ch b{flex:1;text-align:center}
.cal button{border:0;background:transparent;cursor:pointer;border-radius:6px;font:inherit;color:inherit}.cal .ch button{width:26px;height:26px}.cal .ch button:hover,.cal .g button:hover{background:#EEF0FA}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal .g span{font-size:11px;color:#6b6f8d;padding:3px 0}.cal .g button{height:30px}
.cal .g .out{visibility:hidden}.cal .g .hj{box-shadow:inset 0 0 0 1px var(--green)}.cal .g .sel{background:var(--indigo,#07074E);color:#fff}
.cal .cf{display:flex;justify-content:space-between;margin-top:6px}.cal .cf button{padding:4px 8px;font-size:12px;color:#001BB8}
.logo-up{display:flex;align-items:center;gap:14px;margin:12px 0 4px;flex-wrap:wrap}.logo-up .prev{width:160px;height:72px;border:1px dashed #C9CCE0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}.logo-up .prev img{max-width:100%;max-height:100%}
@media print{.cal{display:none!important}}
@media print{header,nav,.idx,.noprint,#saveState{display:none!important}body{background:#fff}.ficha{display:block}.card{break-inside:avoid;border-color:#ccc}main{padding:0}}
</style>
</head>

<script>
/* ===================================================================
 * REGRAS — fonte única das regras de negócio (usada pela tela e pelo
 * servidor de notificações — cópia em lib/regras.js). Funções puras, sem DOM.
 * Modelo: 1 FICHA DE ASSESSMENT por piloto/cliente, com 8 blocos.
 * Nada é obrigatório; a ficha só mede o quanto já está preenchido.
 * =================================================================== */
var STATUS = ['Onboarding', 'Piloto', 'Ativo', 'Pausado', 'Encerrado'];
var RESULTADOS = ['Em andamento', 'Prorrogado', 'Convertido em contrato', 'Encerrado sem conversão'];
var EQUIPS = ['OBD', 'Instalado', 'Rede CAN', 'Câmera Fadiga', 'StreaMax'];
var SEVS = ['Leve', 'Grave', 'Gravíssimo'];
var ACOES = [['', '—'], ['grupo', 'Aviso no grupo de WhatsApp'], ['motorista', 'Ligar para o motorista'], ['gestor', 'Ligar para o gestor da frota']];
var EMAIL_CSO = 'cso@grparceria.com.br';
var EVENTOS_BASE = ['Distração', 'Fadiga', 'Uso de celular', 'Excesso de velocidade', 'Ultrapassagem de faixa contínua', 'Colisão',
  'Obstrução de câmera', 'Sem cinto de segurança', 'Freada brusca', 'Curva brusca', 'Distância perigosa', 'Excesso de RPM',
  'Motor ocioso', 'Permanência em ponto', 'Sem identificação do motorista'];
var IDX_VELOCIDADE = 3;
/* Blocos da ficha (sec = índice) */
var GATILHOS = ['Imediato (1ª ocorrência)', 'Nítido 1x', 'Nítido 2x', 'Nítido 3x', '3 s', '5 s', '10 s', '15 s', '30 s', '60 s', '3 eventos em 60 min'];
var FROTAS = [['leve', 'Frota leve'], ['pesada', 'Frota pesada'], ['hibrida', 'Frota híbrida']];
var BLOCOS = ['Referência (HubSpot)', 'Equipamentos enviados', 'Liberação no painel', 'Acesso à plataforma ONE',
  'Grupos de aviso', 'Eventos monitorados', 'Frota monitorada', 'Piloto (início e fim)'];
var DIAS_AVISO_PILOTO = [15, 7, 3, 2, 1, 0]; // dias antes do fim em que o Slack avisa
var DIAS_COBRANCA = [1, 3, 5];               // seg/qua/sex: lembrete de dados faltantes

/* ---------- datas ---------- */
function iso(d) { var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function today() { return iso(new Date()); }
function pd(s) { return new Date(s + 'T12:00:00'); }
function addDays(s, n) { var d = pd(s); d.setDate(d.getDate() + n); return iso(d); }
function diff(a, b) { return Math.round((pd(a) - pd(b)) / 864e5); }
function fdate(s) { if (!s) return '—'; var p = String(s).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

/* ---------- validações ---------- */
function emailOk(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim()); }
function foneOk(s) { return String(s || '').replace(/\D/g, '').length >= 10; }
/** Extrai o ID do registro de um link do HubSpot (ou aceita o próprio ID numérico). */
function hsId(s) {
  s = String(s || '').trim(); if (!s) return '';
  if (/^\d+$/.test(s)) return s;
  var m = s.replace(/[?#].*$/, '').match(/(\d+)\/?$/);
  return m ? m[1] : '';
}
function placasLista(txt) {
  return String(txt || '').split(/[\s,;]+/).map(function (p) { return p.toUpperCase().replace(/[^A-Z0-9]/g, ''); }).filter(Boolean);
}

/* ---------- consultas sobre a ficha ---------- */
function emProjeto(c) { return c.status === 'Onboarding' || c.status === 'Piloto'; }
function ativoCli(c) { return c.status !== 'Pausado' && c.status !== 'Encerrado'; }
function equipTxt(c) {
  var l = EQUIPS.filter(function (e) { return c.equip[e] && +c.equip[e].qtd > 0; }).map(function (e) { return e + ' × ' + c.equip[e].qtd; });
  return l.length ? l.join(', ') : '';
}
function eventosMon(c) { return c.eventos.filter(function (e) { return e.monitorar; }); }
function gruposNomes(c) { return c.grupos.map(function (g) { return (g.nome || '').trim(); }).filter(Boolean); }

/* ---------- dados a preencher (acompanhamento; nada é bloqueante) ---------- */
function itens(c) {
  var L = [];
  function add(sec, l, ok) { L.push({ sec: sec, l: l, ok: !!ok }); }
  var h = c.hubspot;
  add(0, 'ID ou link do HubSpot', h.id);
  add(0, 'Nome da empresa', h.empresa && String(h.empresa).trim());
  add(0, 'Responsável', h.responsavel && String(h.responsavel).trim());
  add(0, 'Região / endereço', h.regiao && String(h.regiao).trim());
  var q = EQUIPS.some(function (e) { return c.equip[e] && +c.equip[e].qtd > 0; });
  add(1, 'Ao menos 1 equipamento com quantidade', q);
  add(1, 'Data de instalação', c.instalacao);
  add(2, 'Liberação no painel respondida (Sim/Não)', c.painel === 'sim' || c.painel === 'nao');
  add(2, 'Painel liberado — ' + EMAIL_CSO + ' adicionado', c.painel === 'sim');
  var us = c.one;
  add(3, 'Ao menos 1 acesso à plataforma ONE', us.length > 0);
  add(3, 'Todos os acessos com nome e e-mail válido', us.length > 0 && us.every(function (u) { return u.nome && emailOk(u.email); }));
  var mon = eventosMon(c);
  add(5, 'Ao menos 1 evento marcado para monitorar', mon.length > 0);
  add(5, 'Todos os eventos monitorados com severidade (Leve/Grave/Gravíssimo)', mon.length > 0 && mon.every(function (e) { return e.sev; }));
  add(5, 'Todos os eventos monitorados com gatilho definido', mon.length > 0 && mon.every(function (e) { return e.gatilho && String(e.gatilho).trim(); }));
  add(5, 'Todos os eventos monitorados com ao menos 1 ação', mon.length > 0 && mon.every(function (e) { return e.acoes.some(function (a) { return a.t; }); }));
  var refs = [];
  c.eventos.forEach(function (e) { e.acoes.forEach(function (a) { if (a.t === 'grupo') refs.push(a.g); }); });
  if (refs.length) add(5, 'Ações de grupo apontam para um grupo cadastrado', refs.every(function (g) { return g && gruposNomes(c).indexOf(g) >= 0; }));
  if (c.eventos[IDX_VELOCIDADE] && c.eventos[IDX_VELOCIDADE].monitorar)
    add(5, 'Excesso de velocidade: ao menos 1 regra (via, % acima e severidade)', c.velocidade.some(function (r) { return r.pct && r.sev; }));
  add(6, 'Tipo de frota (leve, pesada ou híbrida)', c.frota.tipo === 'leve' || c.frota.tipo === 'pesada' || c.frota.tipo === 'hibrida');
  add(6, 'Monitorar todos os veículos OU informar as placas', c.frota.todos || placasLista(c.frota.placas).length > 0);
  add(4, 'Ao menos 1 grupo', c.grupos.length > 0);
  add(4, 'Todos os grupos com nome, objetivo e ao menos 1 pessoa com telefone válido', c.grupos.length > 0 && c.grupos.every(function (g) {
    return g.nome && g.objetivo && g.pessoas.length > 0 && g.pessoas.every(function (p) { return p.nome && foneOk(p.telefone); });
  }));
  add(7, 'Início do piloto', c.inicio);
  add(7, 'Fim previsto do piloto', c.fim && (!c.inicio || c.fim >= c.inicio));
  add(0, 'Responsável Cobli (e-mail)', emailOk(c.responsavel));
  return L;
}
function faltas(c, sec) { return itens(c).filter(function (i) { return i.sec === sec && !i.ok; }).map(function (i) { return i.l; }); }
function completude(c) {
  var L = itens(c), ok = L.filter(function (i) { return i.ok; }).length;
  return { ok: ok, total: L.length, pct: Math.round(ok / L.length * 100) };
}
/** Situação de cada bloco: {sec, titulo, ok, total, pct, completo}. */
function blocos(c) {
  var L = itens(c);
  return BLOCOS.map(function (t, s) {
    var d = L.filter(function (i) { return i.sec === s; }), ok = d.filter(function (i) { return i.ok; }).length;
    return { sec: s, titulo: t, ok: ok, total: d.length, pct: d.length ? Math.round(ok / d.length * 100) : 100, completo: ok === d.length };
  });
}
function nBlocosOk(c) { return blocos(c).filter(function (b) { return b.completo; }).length; }
/** Primeiro bloco incompleto (índice) ou -1. */
function proxBloco(c) { var b = blocos(c); for (var i = 0; i < b.length; i++) if (!b[i].completo) return i; return -1; }
/** Pendências, texto curto por bloco (usado em alertas). */
function pendenciasTxt(c) {
  var out = [];
  BLOCOS.forEach(function (t, s) { var f = faltas(c, s); if (f.length) out.push((s + 1) + '. ' + t + ' (' + f.length + ' item(ns))'); });
  return out;
}

/* ---------- piloto ---------- */
function pilotoInfo(c, hoje) {
  hoje = hoje || today();
  var r = { inicio: c.inicio, fim: c.fim, fimReal: c.fimReal, resultado: c.resultado || 'Em andamento', estado: 'sem datas', total: 0, decorridos: 0, restantes: null, pct: 0 };
  if (!c.inicio || !c.fim) return r;
  r.total = Math.max(1, diff(c.fim, c.inicio));
  r.decorridos = Math.max(0, Math.min(r.total, diff(hoje, c.inicio)));
  r.restantes = diff(c.fim, hoje);
  r.pct = Math.round(r.decorridos / r.total * 100);
  if (c.fimReal || r.resultado === 'Convertido em contrato' || r.resultado === 'Encerrado sem conversão') r.estado = 'encerrado';
  else if (hoje < c.inicio) r.estado = 'planejado';
  else if (r.restantes < 0) r.estado = 'vencido';
  else if (r.restantes <= 7) r.estado = 'vence';
  else r.estado = 'andamento';
  return r;
}

/* ---------- alertas (tela + Slack) ----------
 * freq: 'diario' = Slack todo dia útil · 'mwf' = seg/qua/sex · 'ui' = só na tela */
function alertas(c, hoje) {
  hoje = hoje || today();
  var A = [], resp = c.responsavel ? [c.responsavel] : [];
  function add(n, tipo, t, freq, r) { A.push({ n: n, tipo: tipo, t: t, freq: freq, resp: r || resp }); }
  if (c.status === 'Encerrado' || c.status === 'Pausado') return A;
  var pend = pendenciasTxt(c), f = faltas(c, -1);
  if (pend.length || f.length) add('amber', 'falta', 'Ficha de assessment incompleta — ' + pend.concat(f).join('; ') + '.', 'mwf');
  if (c.painel === 'nao' && emProjeto(c)) add('amber', 'painel', 'Painel ainda não liberado — adicione ' + EMAIL_CSO + ' ao painel Cobli do cliente.', 'mwf');
  if (c.status === 'Onboarding' && c.inicio && hoje > c.inicio) add('amber', 'piloto', 'O início do piloto (' + fdate(c.inicio) + ') já passou e o cliente continua em Onboarding.', 'mwf');
  if (c.status === 'Piloto' && c.inicio && !c.reuniaoPainel && diff(hoje, c.inicio) >= 7)
    add('amber', 'reuniao', 'Reunião de dados do painel ainda não registrada (piloto iniciou há ' + diff(hoje, c.inicio) + ' dia(s)).', 'mwf');
  if (emProjeto(c) && c.fim && !c.fimReal && c.resultado !== 'Convertido em contrato' && c.resultado !== 'Encerrado sem conversão') {
    var d = diff(c.fim, hoje), marco = DIAS_AVISO_PILOTO.indexOf(d) >= 0;
    if (d < 0) add('red', 'piloto', 'Piloto passou do fim previsto (' + fdate(c.fim) + ') há ' + (-d) + ' dia(s) — registre o resultado: converter, prorrogar ou encerrar.', 'diario');
    else if (d === 0) add('red', 'piloto', 'Piloto termina HOJE (' + fdate(c.fim) + ') — defina: converter, prorrogar ou encerrar.', 'diario');
    else if (d <= 15) add(d <= 3 ? 'red' : 'amber', 'piloto', 'Piloto termina em ' + d + ' dia(s) (' + fdate(c.fim) + ') — alinhe a decisão com o cliente.', marco ? 'diario' : 'ui');
  }
  return A;
}

/* ---------- mensagens do Slack (puras) ---------- */
function esc_(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function incluir_(a, dia, forcar) { return forcar || a.freq === 'diario' || (a.freq === 'mwf' && DIAS_COBRANCA.indexOf(dia) >= 0); }
function montarMensagens(clientes, hoje, opts) {
  opts = opts || {}; hoje = hoje || today();
  var dia = pd(hoje).getDay(), out = { global: null, clientes: [], dms: [], total: 0, fimDeSemana: false };
  if (!opts.forcar && (dia === 0 || dia === 6)) { out.fimDeSemana = true; return out; }
  var link = opts.url ? '\n<' + opts.url + '|Abrir a plataforma>' : '';
  var porCliente = [], dm = {};
  clientes.forEach(function (c) {
    var al = alertas(c, hoje).filter(function (a) { return incluir_(a, dia, opts.forcar); });
    if (!al.length) return;
    al.sort(function (x, y) { return (x.n === 'red' ? 0 : 1) - (y.n === 'red' ? 0 : 1); });
    porCliente.push({ c: c, al: al });
    al.forEach(function (a) {
      out.total++;
      a.resp.filter(emailOk).forEach(function (m) { (dm[m.toLowerCase()] = dm[m.toLowerCase()] || []).push({ c: c, a: a }); });
    });
  });
  var ico = function (a) { return a.n === 'red' ? '🔴' : '🟡'; };
  if (porCliente.length) {
    var linhas = porCliente.map(function (x) {
      var top = x.al.slice(0, 3).map(function (a) { return '   ' + ico(a) + ' ' + esc_(a.t); });
      if (x.al.length > 3) top.push('   … e mais ' + (x.al.length - 3) + ' ponto(s)');
      return '• *' + esc_(x.c.nome) + '* (' + completude(x.c).pct + '% da ficha)\n' + top.join('\n');
    });
    out.global = { text: '🚨 *Torre de Controle — pontos de atenção em ' + fdate(hoje) + '*\n' + linhas.join('\n') + link };
    porCliente.forEach(function (x) {
      if (!x.c.canalSlack) return;
      out.clientes.push({ canal: x.c.canalSlack, nome: x.c.nome, text: '🚨 *' + esc_(x.c.nome) + ' — Torre de Controle*\n' + x.al.map(function (a) { return ico(a) + ' ' + esc_(a.t); }).join('\n') + link });
    });
  }
  Object.keys(dm).forEach(function (m) {
    var it = dm[m], nomes = {};
    it.forEach(function (i) { (nomes[i.c.nome] = nomes[i.c.nome] || []).push(i.a); });
    var txt = '👋 Oi! Você tem pendências nas fichas de assessment / pilotos da *Torre de Controle*:\n' +
      Object.keys(nomes).map(function (n) { return '*' + esc_(n) + '*\n' + nomes[n].map(function (a) { return '   ' + ico(a) + ' ' + esc_(a.t); }).join('\n'); }).join('\n') + link;
    out.dms.push({ email: m, text: txt });
  });
  return out;
}

function simSalvar(volta){
  const c=get(precoCli);if(!c)return true;const r=simCalc();
  if(r.semMotivo.length){alert('Informe o motivo do desconto em: '+r.semMotivo.map(l=>l.p.nome).join(', ')+'.');return false}
  let mudou=0;
  EQUIPS.forEach(e=>{const n=qi(simE[e]),o=+c.equip[e].qtd||0;if(n!==o){c.equip[e].qtd=n;touch(c,'Equipamentos: '+e+' → '+n);mudou++}});
  const np=qi(simPos);if(np!==(+c.posicoes||0)){c.posicoes=np;touch(c,'Posições de monitoramento → '+np);mudou++}
  const novo={};PRECOS.forEach(p=>{const d=simD[p.k],v=num(d.valor);novo[p.k]={tipo:d.tipo,valor:v,motivo:v?d.motivo.trim():''}});

  setState(mudou?'Salvo no cliente ✓':'Nenhuma alteração');

function evRow(c,e,i,gn){
  const p=`eventos.${i}`;

  return `<tr class="${e.monitorar?'':'off'}"><td class="c"><input type="checkbox" data-chk="${p}.monitorar" ${e.monitorar?'checked':''}></td>
   <td>${e.custom?`<input data-f="${p}.evento" value="${esc(e.evento)}" placeholder="nome do evento">`:`<b>${esc(e.evento)}</b>`}</td>
   <td><select class="sev sv${SEVS.indexOf(e.sev)}" data-f="${p}.sev"><option value="">—</option>${SEVS.map(x=>`<option ${e.sev===x?'selected':''}>${x}</option>`).join('')}</select></td>
   <td class="gat"><select data-gat="${i}"><option value="">—</option>${GATILHOS.map(x=>`<option value="${esc(x)}" ${!e.gOutro&&e.gatilho===x?'selected':''}>${x}</option>`).join('')}<option value="__outro" ${e.gOutro||(e.gatilho&&!GATILHOS.includes(e.gatilho))?'selected':''}>Outro (digitar)…</option></select>${e.gOutro||(e.gatilho&&!GATILHOS.includes(e.gatilho))?`<input style="margin-top:4px" data-f="${p}.gatilho" value="${esc(e.gatilho)}" placeholder="ex.: 7 s">`:''}</td>

   <td>${e.custom?`<button class="btn ghost sm" data-delrow="${p}">✕</button>`:''}</td></tr>`;
}

function logoUpload(c,f){
  if(!/^image\/(png|jpeg|svg\+xml|webp)$/.test(f.type)){toast('Formato não aceito — use PNG, JPG, SVG ou WebP');return}
  const fim=url=>{c.logo=url;touch(c,'Referência: logo do cliente atualizada');renderKeep()};
  const rd=new FileReader();
  rd.onload=()=>{
    if(f.type==='image/svg+xml'){if(rd.result.length>300000){toast('SVG muito pesado (máx. ~200 KB)');return}fim(rd.result);return}
    const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width,300/im.height),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);fim(cv.toDataURL('image/png'))};
    im.onerror=()=>toast('Não consegui ler a imagem');im.src=rd.result};
  rd.readAsDataURL(f)}
/* mini calendário (campos data-date) */
let calEl=null,calAnc=null,calY=0,calM=0;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function calClose(){if(calEl){calEl.remove();calEl=null;calAnc=null}}
function calOpen(inp){calClose();calAnc=inp;const v=parseBR(inp.value),d=v?new Date(v+'T00:00:00'):new Date();calY=d.getFullYear();calM=d.getMonth();calEl=document.createElement('div');calEl.className='cal noprint';document.body.appendChild(calEl);calDraw()}
function calDraw(){
  const sel=parseBR(calAnc.value)||'',hj=today(),first=new Date(calY,calM,1).getDay(),n=new Date(calY,calM+1,0).getDate();
  let g=['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++)g+='<button class="out" tabindex="-1"></button>';
  for(let d=1;d<=n;d++){const i=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;g+=`<button type="button" data-cd="${i}" class="${i===sel?'sel':i===hj?'hj':''}">${d}</button>`}
  calEl.innerHTML=`<div class="ch"><button type="button" data-cm="-12" title="Ano anterior">«</button><button type="button" data-cm="-1" title="Mês anterior">‹</button><b>${MESES[calM]} ${calY}</b><button type="button" data-cm="1" title="Próximo mês">›</button><button type="button" data-cm="12" title="Próximo ano">»</button></div><div class="g">${g}</div><div class="cf"><button type="button" data-cd="${hj}">Hoje</button><button type="button" data-cd="">Limpar</button></div>`;
  const r=calAnc.getBoundingClientRect(),h=calEl.offsetHeight;
  calEl.style.left=Math.max(8,Math.min(r.left+scrollX,innerWidth-262+scrollX))+'px';
  calEl.style.top=(r.bottom+h+8>innerHeight&&r.top>h+8?r.top+scrollY-h-4:r.bottom+scrollY+4)+'px'}
document.addEventListener('click',e=>{
  const t=e.target;
  if(calEl&&!document.contains(calAnc))calClose();
  const cm=t.closest&&t.closest('[data-cm]'),cd=t.closest&&t.closest('[data-cd]');
  if(calEl&&cm){const k=+cm.dataset.cm,d=new Date(calY,calM+k,1);calY=d.getFullYear();calM=d.getMonth();calDraw();return}
  if(calEl&&cd){const a=calAnc,v=cd.dataset.cd;calClose();a.value=dispBR(v);a.dispatchEvent(new Event('change',{bubbles:true}));return}
  if(t.matches&&t.matches('input[data-date]')){if(calAnc!==t)calOpen(t);return}
  if(calEl&&!t.closest('.cal'))calClose()});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[data-date]')&&calAnc!==t)calOpen(t)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Tab')calClose()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ganttAll'){ganttAll=t.checked;render();return}
  const c=view==='ficha'&&get(fichaId);if(!c)return;
  if(t.dataset.gat!==undefined){const ev=c.eventos[+t.dataset.gat];
    if(t.value==='__outro'){ev.gOutro=true;ev.gatilho=''}else{ev.gOutro=false;ev.gatilho=t.value}
    touch(c,`Eventos: gatilho de ${ev.evento||'evento'} → ${ev.gatilho||'(outro)'}`);renderKeep();return}
  if(t.id==='logoFile'){const f=t.files&&t.files[0];t.value='';if(f)logoUpload(c,f);return}
  const isChk=t.dataset.chk!==undefined,path=isChk?t.dataset.chk:t.dataset.f;if(!path)return;
  let val=isChk?t.checked:(t.dataset.n?(t.value===''?0:parseFloat(t.value)):t.value);
  if(t.dataset.date!==undefined){
    if(t.value.trim()==='')val='';
    else{const iso_=parseBR(t.value);if(!iso_){t.classList.add('inv');setState('Data inválida — use dd/mm/aaaa',true);return}val=iso_}
    t.classList.remove('inv')}
  else if(t.type==='email'){val=t.value=t.value.trim().toLowerCase();t.classList.toggle('inv',!!val&&!emailOk(val))}
  else if(t.dataset.mask==='fone'){t.classList.toggle('inv',!!val&&!foneOk(val))}
  else if(t.dataset.mask==='placa'){val=t.value=placasLista(t.value).join('\n')}
  else if(t.type==='text'||t.tagName==='TEXTAREA'){if(t.dataset.mask!=='brl')val=t.value=t.value.trim()}
  const mEv=/^eventos\.(\d+)\.monitorar$/.exec(path);
  if(mEv&&!val){const ev=c.eventos[+mEv[1]];const tem=ev.sev||ev.gatilho||ev.acoes.some(a=>a.t)||(+mEv[1]===IDX_VELOCIDADE&&c.velocidade.length);
    if(tem&&!confirm('Desmarcar "monitorar" apaga severidade, gatilho e ações desta linha. Continuar?')){t.checked=true;return}
    ev.sev='';ev.gatilho='';ev.gOutro=false;ev.acoes=[{t:'',g:''},{t:'',g:''},{t:'',g:''}];if(+mEv[1]===IDX_VELOCIDADE)c.velocidade=[]}
  const {o,last,old}=setPath(c,path,val);
  const top=path.split('.')[0],nomeCampo=last;let log=`${SECLOG[top]||'Cadastro'}: ${nomeCampo} → ${isChk?(val?'sim':'não'):(String(val).length>60||last==='placas'||last==='notas'?'(atualizado)':val||'(vazio)')}`;
  let rerender=isChk||t.tagName==='SELECT'||t.type==='radio';
  if(path==='hubspot.link'){if(!c.hubspot.id){c.hubspot.id=hsId(val);const hi=$('#hsId');if(hi)hi.value=c.hubspot.id}log='Referência: link do HubSpot atualizado'}
  if(path==='nome'){log='Nome → '+val}
  if(/^eventos\.\d+\.acoes\.\d+\.t$/.test(path)&&val!=='grupo'){o.g=''}
    if(/^grupos\.\d+\.nome$/.test(path)&&old&&old!==val){c.eventos.forEach(ev=>ev.acoes.forEach(a=>{if(a.t==='grupo'&&a.g===old)a.g=val}));refreshGrupoOpts(c)}
  if(path==='resultado'){
    if(['Convertido em contrato','Encerrado sem conversão'].includes(val)&&!c.fimReal)c.fimReal=today();
    if(val==='Convertido em contrato'&&c.status!=='Ativo'&&confirm('Piloto convertido em contrato. Mudar o status do cliente para Ativo?'))c.status='Ativo';
    if(val==='Encerrado sem conversão'&&c.status!=='Encerrado'&&confirm('Piloto encerrado sem conversão. Mudar o status do cliente para Encerrado?'))c.status='Encerrado';
    rerender=true}
  if(path.startsWith('equip.'))rerender=false,t.closest('.eq').classList.toggle('on',val>0);
  touch(c,log);
  if(rerender)renderKeep();else updateMeta(c);
});
document.addEventListener('input',e=>{const t=e.target;if(calEl&&t===calAnc){const v=parseBR(t.value);if(v){calY=+v.slice(0,4);calM=+v.slice(5,7)-1;calDraw()}}
  if(t.dataset&&t.dataset.mask&&MASK[t.dataset.mask]){const v=MASK[t.dataset.mask](t.value);if(v!==t.value)t.value=v}
  if(e.target.id==='busca'){busca=e.target.value;const pos=e.target.selectionStart;render();const b=$('#busca');b.focus();b.setSelectionRange(pos,pos)}});
async function carregaNotif(){try{notif=await rpc('getNotificacoes');if(view==='notif')render()}catch(e){setState('Erro: '+e.message,true)}}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-open],[data-view],[data-filtro],[data-act],[data-addrow],[data-delrow],[data-goto]');
  if(!t)return;const d=t.dataset,c=view==='ficha'&&get(fichaId);
  if(view==='precos'&&simDirty()&&(d.open||(d.view&&d.view!=='precos')||d.act==='newClient')){if(!await guardaSim())return}
  if(d.open){openFicha(d.open,d.goto);return}
  if(d.goto!==undefined&&!d.open){scrollBloco(+d.goto);return}
  if(d.view){view=d.view;if(view==='precos')simLoad(precoCli);render();if(view==='notif'&&!notif)carregaNotif();return}
  if(d.filtro){filtro=d.filtro;render();return}
  if(d.addrow&&c){const path=d.addrow,arr=resolve(c,path),last=path.split('.').pop();
    if(last==='one')arr.push({nome:'',email:''});
    else if(last==='grupos')arr.push({nome:'',objetivo:'',pessoas:[{nome:'',telefone:''}]});
    else if(last==='pessoas')arr.push({nome:'',telefone:''});
    else if(last==='velocidade')arr.push({via:'',pct:'',seg:'',sev:''});
    else if(last==='eventos'){const n=novoEvento('');n.custom=true;n.monitorar=true;arr.push(n)}
    touch(c,'Linha adicionada ('+last+')');renderKeep();return}
  if(d.delrow&&c){const k=d.delrow.split('.'),idx=+k.pop(),arr=resolve(c,k.join('.')),last=k[k.length-1];
    if(last==='grupos'){const g=arr[idx];if(!confirm(`Remover o grupo "${g.nome||'sem nome'}"?`))return;c.eventos.forEach(ev=>ev.acoes.forEach(a=>{if(a.t==='grupo'&&a.g===g.nome)a.g=''}))}
    arr.splice(idx,1);touch(c,'Linha removida ('+last+')');renderKeep();return}
  const a=d.act;
  if(a==='simular'&&c){simLoad(c.id);view='precos';render();window.scrollTo(0,0);return}
  if(a==='simSalvarVoltar'){simSalvar(true);return}
  if(a==='simVoltar'){if(simDirty()&&!confirm('Descartar as alterações e voltar para o cliente?'))return;openFicha(precoCli);return}
  if(a==='saveBack'){await saveAndBack(c)}
  if(a==='newClient'){const nome=prompt('Nome do cliente / piloto:');if(!nome||!nome.trim())return;
    const n=novoCliente(nome.trim());S.clientes.unshift(n);touch(n,'Piloto cadastrado');openFicha(n.id)}
  if(a==='seed'){for(const nome of['Via Cristais','Núcleo Engenharia']){const n=novoCliente(nome,{status:'Ativo'});S.clientes.push(n);touch(n,'Cliente cadastrado (já em operação)')}render()}
  if(a==='delClient'){if(!confirm(`Excluir "${c.nome}" definitivamente?`))return;
    try{await rpc('deleteCliente',c.id);S.clientes=S.clientes.filter(x=>x!==c);view='painel';fichaId=null;render()}catch(err){setState('Erro: '+err.message,true)}}
  if(a==='prorrogar'){const n=+d.dias;c.fim=addDays(c.fim||today(),n);c.fimReal='';c.resultado='Prorrogado';touch(c,`Piloto prorrogado em ${n} dias → novo fim previsto ${fdate(c.fim)}`);renderKeep()}
  if(a==='histShow'){histAberto=true;renderKeep()}
  if(a==='evTodos'){c.eventos.forEach(ev=>ev.monitorar=true);touch(c,'Eventos: todos marcados para monitorar');renderKeep()}
  if(a==='evLimpar'){if(!confirm('Limpar severidade, gatilho e ações de todos os eventos?'))return;c.eventos.forEach(ev=>{ev.monitorar=false;ev.sev='';ev.gatilho='';ev.gOutro=false;ev.acoes=[{t:'',g:''},{t:'',g:''},{t:'',g:''}]});touch(c,'Eventos: matriz limpa');renderKeep()}
  if(a==='evSugestao'){if(!confirm('Marcar os 8 eventos de controle imediato e preencher severidade, gatilho e 1ª ação com a sugestão da matriz padrão? Isso substitui o que já está nesses eventos.'))return;
    const g0=gruposNomes(c)[0]||'';
    c.eventos.forEach(ev=>{const s=SUGESTAO[ev.evento];if(!s)return;ev.monitorar=true;ev.sev=s[0];ev.gatilho=s[2];ev.gOutro=!GATILHOS.includes(s[2]);ev.acoes=[{t:s[1],g:s[1]==='grupo'?g0:''},{t:'',g:''},{t:'',g:''}]});
    touch(c,'Eventos: sugestão da matriz padrão aplicada');renderKeep()}
  if(a==='fichaCsv')dl(`ficha-${c.nome}.csv`,toCsv(fichaRows(c)));
  if(a==='proposta'&&c){abrirProposta(c);return}
  if(a==='print')window.print();
  if(a==='logoDel'){c.logo='';touch(c,'Referência: logo do cliente removida');renderKeep()}
  if(a==='csv')dl(`torre-de-controle-${today()}.csv`,toCsv([['Cliente','Status','Empresa (HubSpot)','Região','Ficha preenchida','Blocos completos','Próximo bloco','Equipamentos','Painel liberado','Eventos monitorados','Grupos','Início piloto','Fim previsto','Resultado','Responsável Cobli'],
    ...S.clientes.map(c=>{const p=proxBloco(c);return[c.nome,c.status,c.hubspot.empresa,c.hubspot.regiao,completude(c).pct+'%',nBlocosOk(c)+'/8',p<0?'Ficha completa':BLOCOS[p],equipTxt(c),c.painel==='sim'?'Sim':c.painel==='nao'?'Não':'',eventosMon(c).length,c.grupos.length,fdate(c.inicio),fdate(c.fim),c.resultado,c.responsavel]})]));
  if(a==='slSalvar'){try{notif=await rpc('salvarSlack',$('#slTok').value,$('#slCanal').value.trim(),'',$('#slTeste').value.trim());setState('Slack salvo ✓');render()}catch(err){setState('Erro: '+err.message,true)}}
  if(a==='slGatilho'){try{notif=await rpc('ativarGatilho');setState('Envio diário ativado ✓');render()}catch(err){setState('Erro: '+err.message,true)}}
  if(a==='slTeste'){try{const r=await rpc('enviarTeste');alert(r.ok?'Teste enviado para '+(r.destino||'você')+'! Confira o Slack e o e-mail.':'Não foi possível enviar:\n\n'+r.erros.join('\n'))}catch(err){alert('Erro: '+err.message)}}
  if(a==='slPrevia'){try{prev=await rpc('previaNotificacoes');render()}catch(err){setState('Erro: '+err.message,true)}}
  if(a==='slEnviar'){if(!confirm(n_testeMsg()))return;
    try{const r=await rpc('enviarAgora');notif=await rpc('getNotificacoes');render();alert(`Enviado: ${r.alertas} alerta(s) · canal geral ${r.global} · canais de clientes ${r.canais} · mensagens diretas ${r.dms}${r.erros&&r.erros.length?'\n\nAvisos:\n'+r.erros.join('\n'):''}`)}catch(err){alert('Erro: '+err.message)}}
});
function n_testeMsg(){return notif&&notif.testeEmail?`MODO TESTE: o resumo será enviado só para ${notif.testeEmail} (Slack + e-mail). Continuar?`:'Enviar agora o resumo para o canal e as mensagens diretas aos responsáveis?'}
const toCsv=rows=>'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
window.addEventListener('beforeunload',e=>{if(Object.values(salvando).some(Boolean)||Object.values(pendLogs).some(l=>l&&l.length)||simDirty()){e.preventDefault();e.returnValue=''}});

  try{
    const b=await rpc('getBootstrap');
